<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><meta name="author" content="GaabDev"><title>ExileMC • Banners Automáticos</title><style>body{margin:0;background:#060910;color:#f5f8ff;font-family:system-ui;padding:20px}.wrap{max-width:1100px;margin:auto}.grid{display:grid;grid-template-columns:360px 1fr;gap:18px}.card{background:#0b111b;border:2px solid #20334d;padding:18px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}.choice,button{background:#111a28;color:#fff;border:0;padding:12px;cursor:pointer}.choice.active{outline:2px solid #1acbff}.input{width:100%;box-sizing:border-box;background:#050910;border:2px solid #20334d;color:#fff;padding:12px;margin:5px 0}canvas{max-width:100%;height:auto}.primary{width:100%;margin-top:12px;background:#1acbff;color:#03101d;font-weight:800}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><h1>ExileMC • Banners Automáticos</h1><p>Escolha a seção. O cenário Minecraft é montado automaticamente.</p><div class="grid"><div class="card"><h3>1. Seção</h3><div id="sections" class="choices"></div><h3>2. Texto</h3><input id="title" class="input"><input id="subtitle" class="input"><h3>3. Estilo</h3><div id="styles" class="choices"></div><button id="download" class="primary">Baixar PNG</button></div><div class="card"><canvas id="canvas"></canvas></div></div><p style="text-align:center;color:#71809c">ExileMC • Desenvolvido por GaabDev</p></div><script>const $=q=>document.querySelector(q),cv=$('#canvas'),x=cv.getContext('2d');const S=[['suporte','SUPORTE','Central de Atendimento','#19d4ff'],['formularios','CANDIDATURAS','Entre para a equipe ExileMC','#76e8ff'],['creator','CREATOR','Programa de Criadores ExileMC','#ff6874'],['appeal','REVISÕES','Central de Recursos e Análises','#b48eff'],['eventos','EVENTOS','Competições da comunidade','#ffd65a'],['anuncios','NOVIDADES','Atualizações oficiais da ExileMC','#58e2ff']];const ST=['Hero','Clean','Cinemático','Emblema'];let sec=0,sty=0;function btn(t,f,a){let b=document.createElement('button');b.className='choice'+(a?' active':'');b.textContent=t;b.onclick=f;return b}function build(){let a=$('#sections');a.innerHTML='';S.forEach((s,i)=>a.append(btn(s[1],()=>{sec=i;sync();build();draw()},sec===i)));let z=$('#styles');z.innerHTML='';ST.forEach((s,i)=>z.append(btn(s,()=>{sty=i;build();draw()},sty===i)))}function sync(){$('#title').value=S[sec][1];$('#subtitle').value=S[sec][2]}function block(px,py,s,c){x.fillStyle=c;x.fillRect(px,py,s,s);x.strokeStyle='#10243b';x.strokeRect(px,py,s,s)}function tower(px){for(let r=0;r<6;r++)for(let c=0;c<3;c++)block(px+c*27,380-r*27,27,r%2?'#26364a':'#1f2d3e')}function draw(){cv.width=1500;cv.height=420;let s=S[sec],g=x.createLinearGradient(0,0,1500,420);g.addColorStop(0,'#030914');g.addColorStop(.5,'#092a4f');g.addColorStop(1,'#07101d');x.fillStyle=g;x.fillRect(0,0,1500,420);tower(1030);tower(1300);if(sec===0){x.fillStyle=s[3];x.globalAlpha=.55;x.fillRect(1120,130,150,210);x.globalAlpha=1}else if(sec===1){x.fillStyle='#d9ccb0';x.fillRect(1040,150,250,160);x.fillStyle='#5b3925';x.fillRect(1160,150,10,160)}else if(sec===2){x.fillStyle='#172235';x.fillRect(1030,150,260,160);x.beginPath();x.arc(1160,230,55,0,7);x.fillStyle=s[3];x.fill()}else if(sec===3){x.fillStyle='#8c744f';x.fillRect(1150,120,20,210);x.fillRect(1050,145,220,16)}else if(sec===4){x.fillStyle='#d9aa3d';x.fillRect(1080,130,160,150);x.fillRect(1145,280,30,70)}else{x.fillStyle='#33455f';x.beginPath();x.moveTo(1050,170);x.lineTo(1250,120);x.lineTo(1250,290);x.lineTo(1050,250);x.fill()}let o=x.createLinearGradient(0,0,1050,0);o.addColorStop(0,'#02070df2');o.addColorStop(1,'#02070d00');x.fillStyle=o;x.fillRect(0,0,1100,420);x.fillStyle='#fff';x.font='bold 88px system-ui';x.fillText($('#title').value.toUpperCase(),85,190);x.fillStyle='#c8d7e9';x.font='600 31px system-ui';x.fillText($('#subtitle').value,90,245);x.fillStyle=s[3];x.fillRect(90,278,560,7);x.font='bold 20px system-ui';x.fillText('EXILEMC • OFICIAL',90,330)}$('#title').oninput=draw;$('#subtitle').oninput=draw;$('#download').onclick=()=>{let a=document.createElement('a');a.download='exilemc-'+S[sec][0]+'-banner.png';a.href=cv.toDataURL('image/png');a.click()};sync();build();draw();</script></body></html>
