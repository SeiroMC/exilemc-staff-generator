{show=e.target.checked;draw()};title.oninput=draw;sub.oninput=draw;lobby.onload=draw;brand.onload=draw;dl.onclick=()=>{let a=document.createElement('a');a.download='exilemc-'+i+'-1868x250.png';a.href=cv.toDataURL('image/png');a.click()};sync();build();draw()})();</script></body></html>
