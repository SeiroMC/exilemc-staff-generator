<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><meta name="author" content="GaabDev"><title>ExileMC • Banners Automáticos</title><style>:root{--bg:#060910;--panel:#0b111b;--panel2:#111a28;--edge:#20334d;--cyan:#1acbff;--text:#f5f8ff;--muted:#8390aa;--ok:#66e2a7;--bad:#ff7580}*{box-sizing:border-box}body{margin:0;background:radial-gradient(900px 480px at 50% -100px,#082748 0,transparent 70%),#060910;color:var(--text);font-family:system-ui;padding:18px 12px 42px}.wrap{max-width:1160px;margin:auto}.top p{color:#93a1bb}.grid{display:grid;grid-template-columns:390px 1fr;gap:18px;align-items:start}.card{background:#0b111b;border:2px solid var(--edge);padding:18px;box-shadow:0 14px 38px #0008}.sec{margin-bottom:20px}.label{font-weight:800;margin-bottom:8px}.hint,.status{font-size:12px;color:var(--muted);line-height:1.5}.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}.choice,button{background:var(--panel2);color:#fff;border:0;padding:12px;cursor:pointer}.choice.active{outline:2px solid var(--cyan);background:#0c2740}.input{width:100%;background:#050910;border:2px solid var(--edge);color:#fff;padding:12px;margin:5px 0;outline:0}.input:focus{border-color:var(--cyan)}.nickrow{display:grid;grid-template-columns:56px 1fr;gap:10px;align-items:center}.head{width:56px;height:56px;border:2px solid var(--edge);background:#050910;display:grid;place-items:center;overflow:hidden}.head img{display:none;width:100%;height:100%;object-fit:cover;image-rendering:pixelated}.head.ready img{display:block}.head.ready span{display:none}.status.ok{color:var(--ok)}.status.bad{color:var(--bad)}.toggle{display:flex;justify-content:space-between;align-items:center;margin-top:8px;padding:10px 12px;background:#09101a;border:1px solid var(--edge);font-size:13px}.primary{width:100%;margin-top:12px;background:linear-gradient(#5be1ff,#1687ff);color:#03101d;font-weight:800}.secondary{width:100%;margin-top:8px}.stage{background:#050914;border:2px solid var(--edge);padding:14px;min-height:360px;display:grid;place-items:center;overflow:auto}canvas{max-width:100%;height:auto}.foot{text-align:center;color:#71809c;font-size:12px;margin-top:24px}@media(max-width:820px){.grid{grid-template-columns:1fr}.stage{min-height:280px}}</style></head><body><div class="wrap"><div class="top"><h1>ExileMC • Banners Automáticos</h1><p>Escolha a seção, digite um nick se quiser personalizar e baixe o banner pronto.</p></div><div class="grid"><div class="card"><div class="sec"><div class="label">1. Seção</div><div id="sections" class="choices"></div></div><div class="sec"><div class="label">2. Jogador <span style="color:#8390aa;font-weight:400">(opcional)</span></div><div class="hint">A cabeça aparece como um badge discreto no banner.</div><div class="nickrow"><div id="head" class="head"><span>?</span><img id="headImg"></div><input id="nick" class="input" maxlength="16" placeholder="Ex: GaabDev"></div><div id="status" class="status">Pode deixar em branco.</div><div class="toggle"><span>Mostrar cabeça e nick</span><input id="showPlayer" type="checkbox" checked></div></div><div class="sec"><div class="label">3. Texto</div><input id="title" class="input"><input id="subtitle" class="input"></div><div class="sec"><div class="label">4. Estilo</div><div id="styles" class="choices"></div></div><button id="download" class="primary">Baixar PNG</button><button id="copy" class="secondary">Copiar imagem</button></div><div class="card"><div class="stage"><canvas id="canvas"></canvas></div></div></div><div class="foot">ExileMC • Desenvolvido por GaabDev</div></div><script>const $=q=>document.querySelector(q),cv=$('#canvas'),x=cv.getContext('2d'),nick=$('#nick'),head=$('#head'),headImg=$('#headImg'),status=$('#status');const S=[['suporte','SUPORTE','Central de Atendimento','#19d4ff'],['formularios','CANDIDATURAS','Entre para a equipe ExileMC','#76e8ff'],['creator','CREATOR','Programa de Criadores ExileMC','#ff6874'],['appeal','REVISÕES','Central de Recursos e Análises','#b48eff'],['eventos','EVENTOS','Competições da comunidade','#ffd65a'],['anuncios','NOVIDADES','Atualizações oficiais da ExileMC','#58e2ff']];const ST=['Hero','Clean','Cinemático','Emblema'];let sec=0,sty=0,skin=null,timer,seq=0,showPlayer=true;function btn(t,f,a){let b=document.createElement('button');b.className='choice'+(a?' active':'');b.textContent=t;b.onclick=f;return b}function build(){let a=$('#sections');a.innerHTML='';S.forEach((s,i)=>a.append(btn(s[1],()=>{sec=i;sync();build();draw()},sec===i)));let z=$('#styles');z.innerHTML='';ST.forEach((s,i)=>z.append(btn(s,()=>{sty=i;build();draw()},sty===i)))}function sync(){$('#title').value=S[sec][1];$('#subtitle').value=S[sec][2]}function valid(n){return /^[A-Za-z0-9_]{1,16}$/.test(n)}function load(u){return new Promise(r=>{let i=new Image,t=setTimeout(()=>r(null),9000);i.crossOrigin='anonymous';i.onload=()=>{clearTimeout(t);r(i)};i.onerror=()=>{clearTimeout(t);r(null)};i.src=u+(u.includes('?')?'&':'?')+'v='+Date.now()})}function urls(n){let e=encodeURIComponent(n),a='mc-heads.net/head/'+e+'/256',b='minotar.net/helm/'+e+'/256.png';return['https://images.weserv.nl/?url='+encodeURIComponent(a)+'&output=png','https://images.weserv.nl/?url='+encodeURIComponent(b)+'&output=png','https://mc-heads.net/head/'+e+'/256']}async function lookup(){let n=nick.value.trim(),my=++seq;if(!n){skin=null;head.className='head';status.className='status';status.textContent='Pode deixar em branco.';draw();return}if(!valid(n)){status.className='status bad';status.textContent='Nick inválido.';return}status.className='status';status.textContent='Buscando skin de '+n+'…';for(const u of urls(n)){let im=await load(u);if(my!==seq||nick.value.trim()!==n)return;if(im){skin=im;headImg.src=im.src;head.className='head ready';status.className='status ok';status.textContent='Skin carregada.';draw();return}}skin=null;head.className='head';status.className='status bad';status.textContent='Não consegui carregar a skin agora.';draw()}nick.oninput=()=>{clearTimeout(timer);timer=setTimeout(lookup,500);draw()};$('#showPlayer').onchange=e=>{showPlayer=e.target.checked;draw()};$('#title').oninput=draw;$('#subtitle').oninput=draw;function block(px,py,s,c){x.fillStyle=c;x.fillRect(px,py,s,s);x.strokeStyle='#10243b';x.strokeRect(px,py,s,s)}function tower(px){for(let r=0;r<6;r++)for(let c=0;c<3;c++)block(px+c*27,380-r*27,27,r%2?'#26364a':'#1f2d3e')}function scene(){let s=S[sec];tower(1030);tower(1300);if(sec===0){x.fillStyle=s[3];x.globalAlpha=.5;x.fillRect(1120,125,150,220);x.globalAlpha=1}else if(sec===1){x.fillStyle='#d9ccb0';x.fillRect(1040,150,250,160);x.fillStyle='#5b3925';x.fillRect(1160,150,10,160)}else if(sec===2){x.fillStyle='#172235';x.fillRect(1030,150,260,160);x.beginPath();x.arc(1160,230,55,0,Math.PI*2);x.fillStyle=s[3];x.fill()}else if(sec===3){x.fillStyle='#8c744f';x.fillRect(1150,120,20,210);x.fillRect(1050,145,220,16)}else if(sec===4){x.fillStyle='#d9aa3d';x.fillRect(1080,130,160,150);x.fillRect(1145,280,30,70)}else{x.fillStyle='#33455f';x.beginPath();x.moveTo(1050,170);x.lineTo(1250,120);x.lineTo(1250,290);x.lineTo(1050,250);x.fill()}}function playerBadge(s){if(!showPlayer||!nick.value.trim())return;let px=78,py=83,size=118;x.save();x.shadowColor=s[3];x.shadowBlur=20;x.fillStyle='#050910';x.fillRect(px,py,size,size);x.restore();x.strokeStyle=s[3];x.lineWidth=5;x.strokeRect(px,py,size,size);if(skin){x.imageSmoothingEnabled=false;x.drawImage(skin,px+8,py+8,size-16,size-16)}else{x.fillStyle='#fff';x.font='bold 58px system-ui';x.textAlign='center';x.fillText('?',px+size/2,py+78);x.textAlign='left'}x.fillStyle='#07101cdd';x.fillRect(px,py+size+8,190,39);x.fillStyle=s[3];x.font='bold 21px system-ui';x.fillText(nick.value.trim(),px+12,py+size+34)}function draw(){cv.width=1500;cv.height=420;let s=S[sec],g=x.createLinearGradient(0,0,1500,420);g.addColorStop(0,'#030914');g.addColorStop(.5,'#092a4f');g.addColorStop(1,'#07101d');x.fillStyle=g;x.fillRect(0,0,1500,420);scene();let o=x.createLinearGradient(0,0,1050,0);o.addColorStop(0,'#02070df4');o.addColorStop(1,'#02070d00');x.fillStyle=o;x.fillRect(0,0,1100,420);playerBadge(s);let off=showPlayer&&nick.value.trim()?310:85;x.fillStyle='#fff';x.font='bold 84px system-ui';x.fillText($('#title').value.toUpperCase(),off,183);x.fillStyle='#c8d7e9';x.font='600 30px system-ui';x.fillText($('#subtitle').value,off+5,238);x.fillStyle=s[3];x.fillRect(off+5,272,520,7);x.font='bold 20px system-ui';x.fillText('EXILEMC • OFICIAL',off+5,324)}function blob(){return new Promise(r=>cv.toBlob(r,'image/png'))}$('#download').onclick=async()=>{let b=await blob(),a=document.createElement('a');a.download='exilemc-'+S[sec][0]+'-banner.png';a.href=URL.createObjectURL(b);a.click()};$('#copy').onclick=async()=>{try{let b=await blob();await navigator.clipboard.write([new ClipboardItem({'image/png':b})])}catch{alert('Seu navegador não permite copiar PNG diretamente.')}};sync();build();draw();</script></body></html>
